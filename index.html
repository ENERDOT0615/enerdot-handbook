<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에너닷 생활백서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F8;--panel:#FFFFFF;--ink:#0E1E2C;--muted:#5A6776;--line:#DCE2E8;
  --blue:#0975D0;--blue-soft:#E4F0FB;--green:#00AE77;--green-ink:#00865C;--green-soft:#E0F5EC;
  --navy:#0E1E2C;--on-navy:#FFFFFF;--on-navy-muted:#A9B7C6;
  --warn:#B42318;--warn-soft:#FDECEA;--chk:#8A5A00;--chk-soft:#FFF4D6;--mark:#CFE6FB;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0B1620;--panel:#122230;--ink:#EEF2F6;--muted:#9AA9B8;--line:#24384A;
  --blue:#4FA3EC;--blue-soft:#12304A;--green:#2FCB93;--green-ink:#2FCB93;--green-soft:#0F3328;
  --navy:#162B3D;--on-navy:#FFFFFF;--on-navy-muted:#A9B7C6;
  --warn:#FF9C8F;--warn-soft:#3A1A17;--chk:#F2CF73;--chk-soft:#332810;--mark:#1D4A72;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0B1620;--panel:#122230;--ink:#EEF2F6;--muted:#9AA9B8;--line:#24384A;
  --blue:#4FA3EC;--blue-soft:#12304A;--green:#2FCB93;--green-ink:#2FCB93;--green-soft:#0F3328;
  --navy:#162B3D;--on-navy:#FFFFFF;--on-navy-muted:#A9B7C6;
  --warn:#FF9C8F;--warn-soft:#3A1A17;--chk:#F2CF73;--chk-soft:#332810;--mark:#1D4A72;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;text-decoration:none;white-space:nowrap}
.brand img{height:22px;width:auto;display:block}.brand .lg-d{display:none}.brand .bt{font-weight:500;color:var(--muted);font-size:15px;padding-left:12px;border-left:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand .lg-l{display:none}:root:not([data-theme="light"]) .brand .lg-d{display:block}}
:root[data-theme="dark"] .brand .lg-l{display:none}:root[data-theme="dark"] .brand .lg-d{display:block}
.sbox{flex:1;position:relative;max-width:560px}
.sbox input{width:100%;font:inherit;font-size:15px;padding:9px 14px 9px 38px;border:1.5px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink)}
.sbox input:focus{outline:none;border-color:var(--blue)}
.sbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.top .sbox{display:none}
.ext{margin-left:auto;display:flex;gap:18px;font-size:14.5px;font-weight:500;white-space:nowrap}
.ext a{text-decoration:none;color:var(--muted)}
.ext a:hover{color:var(--blue)}
.homeres{margin:36px 0 0}
body.inner .top .sbox{display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
.admin{margin:18px 0 0;border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px 16px;font-size:14.5px;line-height:1.6}
.admin a{margin-left:8px;white-space:nowrap}
.admin b{font-weight:700}
.admin a{font-weight:700}
/* home */
.hero{position:relative;overflow:hidden;margin-top:20px;background:var(--navy);color:var(--on-navy);border-radius:20px;padding:56px 48px 44px}
.hero::after{content:"";position:absolute;right:-60px;bottom:-40px;width:440px;height:347px;background:url(assets/symbol.png) no-repeat center/contain;opacity:.95;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .eyebrow{color:var(--on-navy-muted);font-size:15px;margin:0 0 6px;font-weight:500}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.25;margin:0 0 22px;font-weight:700;letter-spacing:-.02em}
.hero .sbox{max-width:620px}
.hero .sbox input{font-size:18px;padding:16px 20px 16px 50px;border:0;background:#FFFFFF;color:#0E1E2C;box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.hero .sbox input:focus{box-shadow:0 0 0 4px var(--green)}
.hero .sbox svg{color:#5A6776}
.hero .sbox svg{left:19px;width:20px;height:20px}
.hint{color:var(--on-navy-muted);font-size:14px;margin:12px 0 0}
.sit{margin:30px 0 0;max-width:640px}
.hero .sit h2{color:var(--on-navy-muted)}
.hero .chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.hero .chip:hover{background:var(--green);border-color:var(--green);color:#fff}
.sit h2,.cats h2{font-size:15px;font-weight:700;color:var(--muted);margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:999px;text-decoration:none;cursor:pointer}
.chip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.chip small{color:var(--muted);margin-left:6px;font-size:13px}
.cats{margin:48px 0 0}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:28px 32px}
.cat h3{font-size:19px;margin:0 0 4px;font-weight:700}
.cat .sub{font-size:13px;color:var(--muted);margin:14px 0 4px;font-weight:500}
.cat ul{list-style:none;margin:0;padding:0;border-top:3px solid var(--blue)}
.cat:nth-child(even) ul{border-top-color:var(--green)}
.cat h3{display:flex;align-items:center;gap:10px}
.cat h3::before{content:"";width:22px;height:8px;background:var(--blue);transform:skewX(-22deg);border-radius:1px}
.cat:nth-child(even) h3::before{background:var(--green)}
.cat li a{display:flex;align-items:baseline;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);text-decoration:none}
.cat li a:hover .t{color:var(--blue)}
.cat .ic{width:22px;flex:none;text-align:center}
.cat .t{flex:1}
.tag{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap}
.tag.new{background:var(--green-soft);color:var(--green-ink)}
.tag.sen{background:var(--warn-soft);color:var(--warn)}
.tag.chk{background:var(--chk-soft);color:var(--chk)}
.foot{margin:56px 0 0;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 18px}
/* layout inner */
.inner-grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;padding-top:28px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;font-size:14.5px;padding-bottom:20px}
.side h4{font-size:12.5px;color:var(--muted);margin:18px 0 4px;font-weight:700}
.side h4:first-child{margin-top:0}
.side a{display:block;padding:4px 10px;border-radius:6px;text-decoration:none;color:var(--muted)}
.side a:hover{color:var(--ink)}
.side a.on{background:var(--green-soft);color:var(--green-ink);font-weight:700}
.crumb{font-size:14px;color:var(--muted)}
.crumb a{text-decoration:none}
article{max-width:760px}
article h1{font-size:clamp(26px,4vw,34px);margin:6px 0 8px;line-height:1.3;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lead{font-size:17.5px;color:var(--muted);margin:0 0 22px}
.src{display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:500;color:var(--blue);text-decoration:none;border:1px solid var(--blue);padding:5px 12px;border-radius:999px}
.src:hover{background:var(--green-soft)}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 28px}
article h2{font-size:20px;margin:36px 0 10px;padding-top:4px;display:flex;align-items:center;gap:10px}
article h2::before{content:"";width:16px;height:6px;background:var(--green);transform:skewX(-22deg);flex:none}
article p{margin:0 0 12px}
article ul,article ol{margin:0 0 14px;padding-left:22px}
article li{margin:4px 0}
article li::marker{color:var(--green)}
.ck{list-style:none;padding:0}
.ck li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);margin:0}
.ck input{margin-top:6px;width:17px;height:17px;accent-color:var(--green);flex:none}
.ck li.done span{color:var(--muted);text-decoration:line-through}
blockquote{margin:0 0 16px;padding:4px 0 4px 16px;border-left:3px solid var(--green);font-size:17px}
.w{background:var(--blue-soft);border-left:4px solid var(--blue);border-radius:8px;padding:10px 14px;margin:0 0 14px;font-weight:500}
.w::before{content:"꼭 확인 ";font-weight:700;color:var(--blue);margin-right:4px}
.tw{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:520px}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--green-soft);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
code{background:var(--green-soft);padding:1px 6px;border-radius:4px;font-size:.92em}
.note{font-size:14.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:28px}
.box{border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:15px}
.box.sen{background:var(--warn-soft);color:var(--warn)}
.box.chk{background:var(--chk-soft);color:var(--chk)}
.box b{display:block;margin-bottom:2px}
.xref{color:var(--blue);font-weight:500;text-decoration:none;border-bottom:1px solid currentColor}
.related{margin-top:40px}
.related h2{font-size:15px;color:var(--muted)}
/* search results */
.res-head{font-size:15px;color:var(--muted);margin:0 0 14px}
.res{list-style:none;margin:0;padding:0;max-width:780px}
.res li a{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none}
.res .rt{font-weight:700;font-size:17px}
.res .rg{font-size:13px;color:var(--muted);margin-left:8px;font-weight:400}
.res .rs{color:var(--muted);font-size:14.5px;margin-top:2px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:24px 0;color:var(--muted)}
@media (max-width:1100px){.hero::after{opacity:.3}}
@media (max-width:860px){
  .hero{padding:32px 20px 28px;border-radius:14px}
  .hero::after{width:220px;height:174px;right:-50px;bottom:-30px;opacity:.35}
  .brand img{height:18px}
  .inner-grid{grid-template-columns:1fr;gap:12px}
  .side{display:none}
  .top-in{gap:12px;padding:10px 16px}
  .brand .bt{display:none}
  .ext{gap:12px;font-size:13.5px}
  .wrap{padding:0 16px 60px}
}
@media (prefers-reduced-motion:no-preference){.chip,.src{transition:border-color .15s,background .15s,color .15s}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#" aria-label="에너닷 생활백서 홈"><img class="lg-l" src="assets/logo.png" alt="ENERDOT"><img class="lg-d" src="assets/logo-dark.png" alt="ENERDOT"><span class="bt full">생활백서</span></a>
  <div class="sbox"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q2" type="search" placeholder="생활백서 검색" aria-label="생활백서 검색" autocomplete="off"></div>
  <nav class="ext" aria-label="에너닷 바로가기"><a href="https://www.enerdot.co.kr" target="_blank" rel="noopener">홈페이지</a><a href="https://blog.naver.com/enerdot" target="_blank" rel="noopener">블로그</a><a href="https://www.enerdot.co.kr/careers" target="_blank" rel="noopener">채용</a></nav>
</div></header>
<main class="wrap" id="app"></main>
<script>
/* ===== 설정: 여기만 고치면 돼요 ===== */
// 내용 파일 목록 (content 폴더). 순서대로 읽어요.
const FILES=['01-start.md','02-about.md','03-space.md','04-help.md','05-work.md','06-fun.md'];
// 첫 화면 아래쪽에 보이는 기준일 문구
const SNAPSHOT='원본: Notion 에너닷 생활백서';
/* ==================================== */
let DATA=[];
const CATS=[
 {k:'start',n:'처음 오셨나요?'},{k:'about',n:'에너닷이 궁금하다면'},{k:'space',n:'공간이 궁금하다면'},
 {k:'help',n:'도움이 필요하다면'},{k:'work',n:'우리가 일하는 방식'},{k:'fun',n:'우리가 즐기는 방식'}];
const SIT=[
 ['법인카드를 썼어요','card'],['개인 돈으로 결제했어요','refund'],['연차·반차 쓰고 싶어요','leave'],
 ['출장 가요','trip'],['야근했어요','overtime'],['출퇴근 기록이 빠졌어요','flex'],
 ['재직증명서가 필요해요','flex'],['회의실 잡아요','workspace'],['법인차량 쓸래요','car'],
 ['택배·퀵 보내요','post'],['손님이 와요','etiquette'],['세금계산서 발행','invoice'],
 ['도장 찍어야 해요','seal'],['재택근무 해요','remote'],['경조사가 생겼어요','welfare']];
let byId={};
const app=document.getElementById('app');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function inl(s){
  let h=esc(s);
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
  h=h.replace(/\[\[([\w-]+)\]\]/g,(m,id)=>byId[id]?`<a class="xref" href="#${id}">${byId[id].title}</a>`:m);
  h=h.replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g,'$1<a class="xref" href="$2" target="_blank" rel="noopener">$2</a>');
  return h;
}
const plain=s=>s.replace(/\*\*|`/g,'').replace(/\[\[([\w-]+)\]\]/g,(m,id)=>byId[id]?byId[id].title:'');
function texts(p){const o=[];for(const b of p.blocks){if(b.x)o.push(b.x);if(b.i)o.push(...b.i);if(b.r)b.r.forEach(r=>o.push(r.join(' · ')))}return o.map(plain)}
let sensN=0,chkN=0;
function tags(p){let t='';if(p.new)t+='<span class="tag new">업데이트</span>';if(p.sens.length)t+='<span class="tag sen">⚠️ 확인</span>';else if(p.check)t+='<span class="tag chk">내용 확인</span>';return t}
function adminBar(){if(!chkN)return '';return `<div class="admin" role="note">⚠️ <span><b>공유 전 확인:</b> 원문끼리 내용이 다른 곳 ${chkN}건이 표시돼 있어요.</span><a href="#check">목록 보기</a></div>`}
const searchIcon='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';

function home(){
  document.body.classList.remove('inner');
  let h=adminBar()+`<section class="hero"><p class="eyebrow">에너닷 생활백서</p><h1>무엇이 궁금하세요?</h1>
  <div class="sbox">${searchIcon}<input id="q1" type="search" placeholder="예: 법인카드 영수증, 연차, 출장비, 와이파이" aria-label="생활백서 검색" autocomplete="off"></div>
  <p class="hint">제목뿐 아니라 ${DATA.length}개 페이지의 본문 전체에서 찾아요.</p>
  <div class="sit"><h2>이럴 땐 여기</h2><div class="chips">${SIT.map(([l,id])=>`<a class="chip" href="#${id}">${l}</a>`).join('')}</div></div></section>
  <section class="homeres" id="homeRes" hidden></section>
  <section class="cats" id="homeCats"><div class="catgrid">`;
  for(const c of CATS){
    const ps=DATA.filter(p=>p.cat===c.k);const groups=[...new Set(ps.map(p=>p.group))];
    h+=`<div class="cat"><h3>${c.n}</h3>`;
    for(const g of groups){
      if(groups.length>1)h+=`<div class="sub">${g}</div>`;
      h+='<ul>'+ps.filter(p=>p.group===g).map(p=>`<li><a href="#${p.id}"><span class="ic">${p.icon}</span><span class="t">${p.title}</span>${tags(p)}</a></li>`).join('')+'</ul>';
    }
    h+='</div>';
  }
  h+=`</div></section><footer class="foot"><span>${SNAPSHOT}</span></footer>`;
  app.innerHTML=h;
  const q=document.getElementById('q1'),res=document.getElementById('homeRes'),cats=document.getElementById('homeCats'),foot=app.querySelector('.foot'),sit=app.querySelector('.hero .sit');
  let tm;
  q.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{
    const v=q.value;const on=!!v.trim();
    res.hidden=!on;cats.hidden=on;foot.hidden=on;sit.hidden=on;
    if(on)res.innerHTML=resultsHTML(v);else res.innerHTML='';
  },120)});
}
function side(cur){
  let h='<nav class="side" aria-label="전체 목차">';
  for(const c of CATS){h+=`<h4>${c.n}</h4>`+DATA.filter(p=>p.cat===c.k).map(p=>`<a href="#${p.id}" class="${p.id===cur?'on':''}">${p.icon} ${p.title}</a>`).join('')}
  return h+'</nav>';
}
function renderBlocks(bs){
  return bs.map(b=>{
    if(b.t==='h')return `<h2>${inl(b.x)}</h2>`;
    if(b.t==='p')return `<p>${inl(b.x)}</p>`;
    if(b.t==='q')return `<blockquote>${inl(b.x)}</blockquote>`;
    if(b.t==='w')return `<div class="w">${inl(b.x)}</div>`;
    if(b.t==='ul')return '<ul>'+b.i.map(x=>`<li>${inl(x)}</li>`).join('')+'</ul>';
    if(b.t==='ol')return '<ol>'+b.i.map(x=>`<li>${inl(x)}</li>`).join('')+'</ol>';
    if(b.t==='ck')return '<ul class="ck">'+b.i.map((x,i)=>`<li><input type="checkbox" aria-label="완료 표시"><span>${inl(x)}</span></li>`).join('')+'</ul>';
    if(b.t==='tb'){const[hd,...rs]=b.r;return `<div class="tw"><table><thead><tr>${hd.map(c=>`<th>${inl(c)}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
    return '';
  }).join('');
}
function page(id){
  const p=byId[id];document.body.classList.add('inner');
  const cat=CATS.find(c=>c.k===p.cat)||{n:''};
  let a=`<div class="crumb"><a href="#">홈</a> / ${cat.n} / ${p.group}</div><h1><span>${p.icon}</span>${p.title}</h1><p class="lead">${esc(p.summary)}</p>
  <div class="meta"><a class="src" href="${p.url}" target="_blank" rel="noopener">Notion 원문 보기 ↗</a>${tags(p)}</div>`;
  p.sens.forEach(s=>a+=`<div class="box sen"><b>⚠️ 공유 전 확인 · 민감 정보</b>${inl(s)}</div>`);
  if(p.check)a+=`<div class="box chk"><b>내용 확인 필요</b>${inl(p.check)}</div>`;
  a+=renderBlocks(p.blocks);
  if(p.notes.length)a+=p.notes.map(n=>`<p class="note">${inl(n)}</p>`).join('');
  const sib=DATA.filter(x=>x.group===p.group&&x.id!==p.id);
  if(sib.length)a+=`<div class="related"><h2>${p.group}의 다른 페이지</h2><div class="chips">${sib.map(x=>`<a class="chip" href="#${x.id}">${x.icon} ${x.title}</a>`).join('')}</div></div>`;
  app.innerHTML=`<div class="inner-grid">${side(id)}<article>${a}</article></div>`;
  app.querySelectorAll('.ck input').forEach(c=>c.addEventListener('change',()=>c.parentElement.classList.toggle('done',c.checked)));
  window.scrollTo(0,0);
}
function checkList(){
  document.body.classList.add('inner');
  let a=`<div class="crumb"><a href="#">홈</a></div><h1>공유 전 확인 목록</h1><p class="lead">Notion 원문끼리 내용이 서로 다른 곳이에요. Notion을 정리한 뒤 알려주시면 이 표시도 지울게요.</p><h2>내용 불일치 (${chkN}건)</h2><ul class="res">`;
  DATA.filter(p=>p.check).forEach(p=>a+=`<li><a href="#${p.id}"><span class="rt">${p.icon} ${p.title}</span><div class="rs">${esc(p.check)}</div></a></li>`);
  app.innerHTML=`<div class="inner-grid">${side('')}<article>${a}</ul></article></div>`;window.scrollTo(0,0);
}
const PART=/(으로|에서|에게|까지|부터|은|는|이|가|을|를|에|도|의|로|와|과|요)$/;
function toks(q){return q.toLowerCase().split(/\s+/).filter(Boolean).map(t=>t.length>2?t.replace(PART,''):t)}
function search(q){
  const ts=toks(q);if(!ts.length)return[];
  const out=[];
  for(const p of DATA){
    let s=0,ok=true;const ti=p.title.toLowerCase(),kw=p.kw.toLowerCase(),su=p.summary.toLowerCase(),gr=p.group.toLowerCase();
    for(const t of ts){
      let st=0;if(ti.includes(t))st+=12;if(kw.includes(t))st+=6;if(su.includes(t))st+=4;if(gr.includes(t))st+=2;
      const n=p._body.split(t).length-1;st+=Math.min(n,5);
      if(!st){ok=false;break}s+=st;
    }
    if(ok)out.push({p,s});
  }
  return out.sort((a,b)=>b.s-a.s);
}
function hl(s,ts){let h=esc(s);for(const t of ts){if(!t)continue;const re=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');h=h.replace(re,m=>`<mark>${m}</mark>`)}return h}
function snippet(p,ts){
  for(const line of p._t){const l=line.toLowerCase();const i=ts.map(t=>l.indexOf(t)).filter(i=>i>=0)[0];
    if(i!==undefined){const st=Math.max(0,i-30);return (st?'…':'')+line.slice(st,st+110)+(line.length>st+110?'…':'')}}
  return p.summary;
}
function resultsHTML(v){
  const ts=toks(v),r=search(v);
  let a=`<p class="res-head">‘${esc(v)}’ 검색 결과 ${r.length}건</p>`;
  if(!r.length)a+=`<div class="empty">찾는 내용이 없어요. 다른 단어로 검색하거나, 아래 상황별 바로가기를 이용해 보세요.<div class="chips" style="margin-top:12px">${SIT.slice(0,8).map(([l,id])=>`<a class="chip" href="#${id}">${l}</a>`).join('')}</div></div>`;
  else a+='<ul class="res">'+r.map(({p})=>`<li><a href="#${p.id}"><span class="rt">${p.icon} ${hl(p.title,ts)}</span><span class="rg">${p.group}</span><div class="rs">${hl(snippet(p,ts),ts)}</div></a></li>`).join('')+'</ul>';
  return a;
}
function renderSearch(v){
  document.body.classList.add('inner');
  app.innerHTML=`<div class="inner-grid">${side('')}<section>${resultsHTML(v)}</section></div>`;
}
let tm2;
document.getElementById('q2').addEventListener('input',e=>{clearTimeout(tm2);tm2=setTimeout(()=>{const v=e.target.value;if(v.trim())renderSearch(v);else route()},120)});
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h==='check')checkList();else if(byId[h])page(h);else{home();}
  if(!byId[h]&&h!=='check')document.getElementById('q2').value='';
}
window.addEventListener('hashchange',()=>{document.getElementById('q2').value='';route()});

function parseMd(txt){
  const out=[];let cur=null;
  for(const raw of txt.split(/\r?\n/)){
    const line=raw.replace(/\s+$/,'');
    if(line.startsWith('@@ ')){
      const m={};line.slice(3).split(' | ').forEach(part=>{const i=part.indexOf('=');if(i>0)m[part.slice(0,i).trim()]=part.slice(i+1).trim()});
      cur={...m,summary:'',kw:'',blocks:[],notes:[],sens:[],new:m.new==='1'};out.push(cur);continue;
    }
    if(!cur||!line.trim()||line.startsWith('%%'))continue;
    const B=cur.blocks,last=B[B.length-1];
    if(line.startsWith('@summary ')){cur.summary=line.slice(9);continue}
    if(line.startsWith('@kw ')){cur.kw=line.slice(4);continue}
    if(line.startsWith('@note ')){cur.notes.push(line.slice(6));continue}
    if(line.startsWith('@check ')){cur.check=line.slice(7);continue}
    if(line.startsWith('## ')){B.push({t:'h',x:line.slice(3)});continue}
    if(line.startsWith('> ')){B.push({t:'q',x:line.slice(2)});continue}
    if(line.startsWith('! ')){B.push({t:'w',x:line.slice(2)});continue}
    if(line.startsWith('| ')){const cells=line.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      if(last&&last.t==='tb')last.r.push(cells);else B.push({t:'tb',r:[cells]});continue}
    const m=line.match(/^(- |\d+\. |\[ \] )(.*)$/);
    if(m){const k=m[1]==='- '?'ul':m[1]==='[ ] '?'ck':'ol';if(last&&last.t===k)last.i.push(m[2]);else B.push({t:k,i:[m[2]]});continue}
    B.push({t:'p',x:line});
  }
  return out;
}
async function init(){
  app.innerHTML='<p class="empty">생활백서를 불러오는 중이에요…</p>';
  try{
    const txts=await Promise.all(FILES.map(f=>fetch('content/'+f,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));
    DATA=txts.flatMap(parseMd).filter(p=>p.id&&p.title);
  }catch(e){
    app.innerHTML=`<p class="empty">내용 파일을 불러오지 못했어요 (${esc(String(e.message||e))}). 파일을 더블클릭해서 열면 이렇게 보여요. GitHub Pages 같은 웹 주소로 열어 주세요.</p>`;return;
  }
  byId=Object.fromEntries(DATA.map(p=>[p.id,p]));
  DATA.forEach(p=>{p._t=texts(p);p._body=p._t.join('\n').toLowerCase()});
  chkN=DATA.filter(p=>p.check).length;
  route();
}
init();
</script>
